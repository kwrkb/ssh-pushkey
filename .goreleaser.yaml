# GoReleaser config — GitHub is the canonical release/distribution source.
# GoReleaser's own changelog generation is disabled; the release body is set
# from CHANGELOG.md by a separate `gh release edit` step after GoReleaser
# publishes (see .github/workflows/release.yml).
# Note: GoReleaser's `--release-notes` flag is loaded inside the changelog
# pipe, so `changelog.disable: true` would silently skip it — hence the
# explicit post-publish step instead of `--release-notes`.
version: 2

project_name: ssh-pushkey

before:
  hooks:
    - go mod tidy

builds:
  - id: ssh-pushkey
    binary: ssh-pushkey
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # match the previous release matrix (no windows/arm64)
      - goos: windows
        goarch: arm64
    ldflags:
      # keep the leading "v" to match the prior `-X main.version=v1.6.0`
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: kwrkb
    name: ssh-pushkey

# Scoop — Windows クライアント向けの配布チャネル。
# Windows OpenSSH には ssh-copy-id が存在しないため、代替が無いのはこの層だけ。
#
# 当初は発見性を理由に WinGet を採ったが、microsoft/winget-pkgs の検証で Defender の
# 誤検知（Validation-Defender-Error）に止められた。本ツールは「SSH で入り authorized_keys を
# 書き icacls で ACL を変更する」という、ヒューリスティックにはバックドア設置と区別が
# つかない挙動をするため再発が見込まれ、毎リリースが外部の審査に依存することになる。
# Scoop は自分の bucket へ push するだけで完結し、リリースが他者の審査で止まらない
# （判断は LESSONS.md）。
#
# トークンはリリース本体用の GITHUB_TOKEN とは別。別リポジトリ（kwrkb/scoop-bucket）への
# write が要り、workflow 既定の GITHUB_TOKEN は当該リポジトリにしか権限が無いため。
#
# directory は `bucket` にする。scoop の `bucket list` は `<repo>\bucket` 配下しか
# 数えず（lib/buckets.ps1）、リポジトリ直下に置くと Manifests 列が 0 と表示される。
# さらに Find-BucketDirectory は `bucket/` が存在すればそこだけを見るため、
# bucket リポジトリ内で直下と `bucket/` が混在すると直下側が無視される。
scoops:
  - name: ssh-pushkey
    directory: bucket
    homepage: https://github.com/kwrkb/ssh-pushkey
    description: An ssh-copy-id alternative for Windows OpenSSH servers
    license: MIT
    # プレリリースでは bucket を更新しない
    skip_upload: auto
    repository:
      owner: kwrkb
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
