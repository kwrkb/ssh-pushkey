name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -ldflags "-X main.version=dev" ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build integration tag (compile-only)
        run: go build -tags=integration ./...
