# 一時ジョブ: 1Password から Scoop PAT を読み出し、scoop-bucket への push 権限を確認する。
# 本番リリースを消費せずに移行の成否を確かめるためのもの。確認できたらこのファイルは削除する。
name: op-check

on:
  push:
    branches: [chore/scoop-pat-via-1password]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Load Scoop PAT from 1Password
        id: op
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCOOP_GITHUB_TOKEN: op://gh/SCOOP_GITHUB_TOKEN/credential

      - name: Verify push access to kwrkb/scoop-bucket
        env:
          GH_TOKEN: ${{ steps.op.outputs.SCOOP_GITHUB_TOKEN }}
        run: |
          # fine-grained PAT が対象リポジトリをリソースに含まない場合、API は 403 ではなく
          # 404 を返す。呼び出しの成否ではなく permissions.push を明示的に確認する。
          PUSH="$(gh api repos/kwrkb/scoop-bucket -q .permissions.push)"
          echo "push permission: $PUSH"
          [ "$PUSH" = "true" ]
