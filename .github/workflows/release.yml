name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history/tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -n "/^## \[${VERSION}\]/,/^## \[/{/^## \[${VERSION}\]/d;/^## \[/d;p}" CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > /tmp/release-notes.md
          fi

      # Scoop の manifest は別リポジトリ kwrkb/scoop-bucket へ push するため、
      # 当該リポジトリにしか権限が無い既定の GITHUB_TOKEN では届かない。専用の PAT が要る。
      # その PAT は GitHub Secrets ではなく 1Password の `gh` vault で管理し、ここで読み出す。
      # GitHub 側に置く長期シークレットは 1Password サービスアカウントのトークン 1 つだけになる。
      #
      # export-env は既定 false（v5）。環境変数にばら撒かず outputs 経由で
      # goreleaser ステップにだけ渡す。
      - name: Load Scoop PAT from 1Password
        id: op
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCOOP_GITHUB_TOKEN: op://gh/SCOOP_GITHUB_TOKEN/credential

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ steps.op.outputs.SCOOP_GITHUB_TOKEN }}

      # GoReleaser の `--release-notes` は changelog パイプ内で読み込まれるため、
      # .goreleaser.yaml の `changelog.disable: true` でパイプごとスキップされ無視される。
      # 配布物生成は GoReleaser に任せ、本文だけは公開後に CHANGELOG 抽出で明示設定する。
      #
      # GoReleaser の publish は release を公開してから scoop を走らせる（release が先、
      # scoop が後 — 後者は release の URL を使うため）。つまり scoop の失敗時には
      # 「リリースは公開済みだが本文が空」という状態になり得る。前ステップが失敗しても
      # 本文設定は必ず試みる。リリース自体が存在しない場合（publish 前の失敗）は何もしない。
      - name: Set release notes from CHANGELOG
        if: ${{ !cancelled() }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            echo "release $GITHUB_REF_NAME does not exist yet; skipping notes update"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
