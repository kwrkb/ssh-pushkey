name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history/tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -n "/^## \[${VERSION}\]/,/^## \[/{/^## \[${VERSION}\]/d;/^## \[/d;p}" CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > /tmp/release-notes.md
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WinGet の manifest は fork(kwrkb/winget-pkgs) へ push し microsoft/winget-pkgs へ
          # PR を開くため、リポジトリ既定の GITHUB_TOKEN では権限が届かない。classic PAT を渡す
          # （fine-grained PAT は cross-fork の PR 作成ができない）。
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

      # GoReleaser の `--release-notes` は changelog パイプ内で読み込まれるため、
      # .goreleaser.yaml の `changelog.disable: true` でパイプごとスキップされ無視される。
      # 配布物生成は GoReleaser に任せ、本文だけは公開後に CHANGELOG 抽出で明示設定する。
      #
      # GoReleaser の publish は release を公開してから winget を走らせる（release が先、
      # winget が後 — 後者は release の URL を使うため）。つまり winget の失敗時には
      # 「リリースは公開済みだが本文が空」という状態になり得る。前ステップが失敗しても
      # 本文設定は必ず試みる。リリース自体が存在しない場合（publish 前の失敗）は何もしない。
      - name: Set release notes from CHANGELOG
        if: ${{ !cancelled() }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            echo "release $GITHUB_REF_NAME does not exist yet; skipping notes update"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
